<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The site's own bird, not Vite's scaffold logo. See the note inside
         the file for what a favicon needs that the on-screen bird does not. -->
    <link rel="icon" type="image/svg+xml" href="/bird.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tarlok Singh — Artist</title>
    <meta
      name="description"
      content="Product design, 3D, motion, film, music and AI engineering. Selected work by Tarlok Singh."
    />
    <!-- Black, matching `.mech`'s own background. It was `#f4f2ec` — v2's
         paper — which on a phone painted the browser chrome above a black
         readout in a light cream. -->
    <meta name="theme-color" content="#000000" />

    <!-- The two faces the readout is drawn in, fetched alongside the JS rather
         than discovered once `Mech.css` has parsed. They were v2's display
         serif until v3 became the site; these are the ones actually on screen
         — Clash Display for the name, a project's title and the wordmark,
         Audiowide for the segment displays.

         It is worth more here than a preload usually is: `primed` in
         `Mech.tsx` holds the boot on `document.fonts.ready`, so a face
         discovered late does not just swap in late, it delays the whole
         opening. Both are one file and 43 KB together. -->
    <link
      rel="preload"
      href="/fonts/clash-display/ClashDisplay-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/audiowide/Audiowide-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- The first product model and its Draco decoder are otherwise only
         discovered once the JS bundle has parsed and mounted the stage — on a
         high-latency connection that is several round trips stacked in series
         before the model can even start rendering, which is what reads as the
         entrance arriving broken. -->
    <link rel="preload" href="/models/capsule-c1.glb" as="fetch" crossorigin />
    <link rel="preload" href="/draco/draco_decoder.wasm" as="fetch" crossorigin />
    <link rel="preload" href="/draco/draco_decoder.js" as="fetch" crossorigin />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
